<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Practico 1</title>
    <link rel="StyleSheet" href="StyleSheet.css">
</head>

    
<body>
    <!--Div para el bloque principal donde se resumiria los datos de ingresos y egresos-->
    <div name="informacion-principal">
        <h1 id="titulo-presupuesto"></h1> 
        <ul>
            <li>Ingresos: $<span id="total-ingresosPrev">0.00</span></li>
            <li>Egresos: $<span id="total-egresosPrev">0.00</span></li>
            <li>Monto Disponible: $<span id="monto-disponible">0.00</span></li>
            <li>Porcentaje de gastos: <span id="porcentaje-gastos"></span></li>
        </ul>
    </div>
    
    <!--Div para el formulario de ingresos de los movimientos-->
    <div name="ingreso-de-movimientos">
        <form id = "transacciones">
            <h2>Transaccion</h2>
            <select name="transaccion" id="tipo-movimiento">
                <option value="ingresos">Ingresos</option>
                <option value="egresos">Egresos</option>
            </select><br>
            <input type="text" id="descripcion" placeholder="Titulo o descripcion" required><br>
            <input type="number" id="monto" placeholder="Monto" step="0.01" required><br>
            <input type="submit" id="accion" value="Agregar"><br>
        </form>
    </div>
    
    
    <!--Botones para realizar el cambio de tabs-->
    <div class="botones-tabs">
        <button type="button" id="boton-ingresos" onclick="cambiarTab('ingresos')" class="botonTab">Ingresos</button>
        <button type="button" id="boton-egresos" onclick="cambiarTab('egresos')" class="botonTab">Egresos</button>
    </div>
    <div id="panelIngresos" class="panel">
        <h3>Listado de Ingresos</h3>
        <ul id="listado-ingresos">
           <!--contenido del TAB--> 
        </ul>        
    </div>
    <div id="panelEgresos" class="panel">
        <h3>Listado de Egresos</h3>
        <ul id="listado-egresos">
           <!--contenido del TAB--> 
        </ul>        
    </div>

    
</body>
<script src="Logica-Calculos.js"></script>
<script>
        document.getElementById("titulo-presupuesto").textContent = tituloFecha();
        document.getElementById("porcentaje-gastos").textContent = calcularPorcentaje().toFixed(2) + "%"
        cambiarTab("ingresos")
    </script>
</html>
