<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desafío 1</title>
</head>
<body>

  

    <h2>Agregar Ingreso</h2>
    <form id="forma-ingreso">        
        <input type="number" id="valorIngreso" placeholder="Valor (ej. 500)" step="0.01" required>
        <button type="submit">Agregar</button>
    </form>

    <h3>Total Ingresos: $<span id="total-ingresosPrev">0.00</span></h3>

    <h2>Agregar Egresos</h2>
    <form id="forma-egreso">        
        <input type="number" id="valorEgreso" placeholder="Valor (ej. 500)" step="0.01" required>
        <button type="submit">Agregar</button>
    </form>

    <h3>Total Egresos: $<span id="total-egresosPrev">0.00</span></h3>


    <button type="button" id="btn-actualizar">Actualizar Resumen</button>


    <h1 id="titulo-presupuesto"></h1>
    <div>Disponible: <span id="monto-disponible"></span></div>
    <div>Ingresos: <span id="total-ingresos"></span></div>
    <div>Egresos: <span id="total-egresos"></span></div>
    <div>Porcentaje de Gastos: <span id="porcentaje-gastos"></span></div>

    
    <script src="CalculosMatematicos.js"></script>
    <script>
        function actualizarResumen() {
            document.getElementById("titulo-presupuesto").textContent = tituloFecha();
            document.getElementById("monto-disponible").textContent = "$" + totalDisponible().toFixed(2);
            document.getElementById("total-ingresos").textContent = "$" + totalIngresos().toFixed(2);
            document.getElementById("total-egresos").textContent = "$" + totalEgresos().toFixed(2);
            document.getElementById("porcentaje-gastos").textContent = calcularPorcentaje() + "%";
        }

       
        document.getElementById("btn-actualizar").addEventListener("click", actualizarResumen);
    </script>
</body>
</html>
