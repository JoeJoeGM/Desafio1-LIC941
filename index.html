<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desafío 1 - Presupuesto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="titulo-presupuesto">Presupuesto</h1>
    
    <!-- Resumen -->
    <div style="background-color: #f1f1f1; padding: 20px; text-align: center; margin-bottom: 20px;">
        <h2>Disponible: <span id="monto-disponible">$0.00</span></h2>
        <p>INGRESOS: <span id="total-ingresos">$0.00</span></p>
        <p>EGRESOS: <span id="total-egresos">$0.00</span></p>
        <p>Porcentaje de Gastos: <span id="porcentaje-gastos">0%</span></p>
    </div>

    <!-- Formulario unificado (Corregido para que coincida con el JS y el PDF) -->
    <div style="text-align: center; margin-bottom: 30px;">
        <form id="transacciones">        
            <select id="tipo-movimiento" required>
                <option value="ingresos">+</option>
                <option value="egresos">-</option>
            </select>
            <input type="text" id="descripcion" placeholder="Agregar Descripción" required>
            <input type="number" id="monto" placeholder="Valor (ej. 500)" step="0.01" required>
            <button type="submit">Agregar</button>
        </form>
    </div>

    <!-- TU PARTE 5 (Pestañas y Listas) -->
    <div class="contenedor-detalles">
        <div class="tabs-botones">
            <button id="btn-ingresos" class="tab-btn activo" onclick="mostrarTab('ingresos')">Ingresos</button>
            <button id="btn-egresos" class="tab-btn" onclick="mostrarTab('egresos')">Egresos</button>
        </div>

        <div id="tab-ingresos" class="tab-contenido" style="display: block;">
            <ul id="lista-ingresos" class="lista-transacciones"></ul>
        </div>

        <div id="tab-egresos" class="tab-contenido" style="display: none;">
            <ul id="lista-egresos" class="lista-transacciones"></ul>
        </div>
    </div>
    
    <script src="CalculosMatematicos.js"></script>
</body>
</html>s
