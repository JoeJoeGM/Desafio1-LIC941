<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Practico 1</title>
</head>
<body>
    <!--Div para el bloque principal donde se resumiria los datos de ingresos y egresos-->
    <div name="informacion-principal">
        <h1>Presupuesto</h1>
        <h2>"fecha"</h2>
        <ul>
            <li>Ingresos</li>
            <li>Egresos</li>
            <li>Porcentaje de gastos</li>
        </ul>
    </div>
    
    <!--Div para el formulario de ingresos de los movimientos-->
    <div name="ingreso-de-movimientos">
        <form>
            <h2>Transaccion</h2>
            <select name="tipo-de-movimiento">
                <option value="ingresos">Ingresos</option>
                <option value="egresos">Egresos</option>
            </select><br>
            <input type="text" name="Descripcion" placeholder="Titulo o descripcion" required><br>
            <input type="number" name="Monto" placeholder="Monto" required><br>
            <input type="submit" name="Agregar" value="Agregar"><br>
        </form>
    </div>
    
    <!--Div para la tabla donde se reflejan los movimientos-->
    <div name="listado-de-movimientos">
        <ul name="seccion-de-lista">
            <li> Ingresos
                <ul></ul>
            </li>
            <li> Egresos
                <ul></ul>
            </li>
        </ul>
    </div>
</body>
</html>
